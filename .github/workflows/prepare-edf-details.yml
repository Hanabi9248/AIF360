name: Publish validated AIF360 EDF group details
on:
  push:
    branches: [codex/prepare-edf-details]
    paths: [.github/workflows/prepare-edf-details.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 34877916b789e569edf5c0aac033403ca90f34b3
      - name: Apply verified change
        env:
          PATCH_BASE64: 
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/AIF360
          test -z "$(git ls-remote --heads origin refs/heads/codex/edf-group-details)"
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/revision.diff
          git apply --index /tmp/revision.diff
          test "$(git write-tree)" = 7c08e3327d5563d0f1c2605c33401d2f9b30e5ff
          git -c user.name=Hanabi -c user.email=317387557+Hanabi9248@users.noreply.github.com commit -s -m 'Add group-pair details for empirical differential fairness'
          git push origin HEAD:refs/heads/codex/edf-group-details
